<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="StockFlow WMS: prototipo interactivo de un sistema de gestión de depósito.">
  <title>StockFlow WMS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Menú lateral -->
    <aside class="sidebar" id="sidebar" aria-label="Menú principal">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5V20H3z"/><path d="M7 20v-7h10v7"/><path d="M7 16.5h10"/></svg>
        </div>
        <div>
          <strong>StockFlow</strong>
          <small>Gestión de depósito</small>
        </div>
      </div>

      <nav class="nav">
        <div class="nav-label">General</div>
        <a href="#/dashboard" data-route="dashboard"><i data-icon="grid"></i><span>Panel de control</span></a>
        <a href="#/productos" data-route="productos"><i data-icon="box"></i><span>Productos</span></a>
        <a href="#/inventario" data-route="inventario"><i data-icon="layers"></i><span>Inventario</span><b class="nav-count danger" data-count="alertas"></b></a>

        <div class="nav-label">Operaciones</div>
        <a href="#/recepcion" data-route="recepcion"><i data-icon="inbox"></i><span>Recepción</span><b class="nav-count" data-count="recepcion"></b></a>
        <a href="#/internos" data-route="internos"><i data-icon="shuffle"></i><span>Movimientos internos</span></a>
        <a href="#/pedidos" data-route="pedidos"><i data-icon="clipboard"></i><span>Pedidos y despacho</span><b class="nav-count" data-count="pedidos"></b></a>
        <a href="#/devoluciones" data-route="devoluciones"><i data-icon="undo"></i><span>Devoluciones</span></a>

        <div class="nav-label">Gestión</div>
        <a href="#/tareas" data-route="tareas"><i data-icon="check-square"></i><span>Tareas</span><b class="nav-count" data-count="tareas"></b></a>
        <a href="#/historial" data-route="historial"><i data-icon="clock"></i><span>Historial</span></a>
        <a href="#/config" data-route="config"><i data-icon="settings"></i><span>Configuración</span></a>
      </nav>

      <div class="sidebar-footer">
        <span>Demo de LS Nexo Digital</span>
        <span>Prototipo · datos ficticios locales</span>
        <a class="link-btn" href="../demos/deposito.html">← Volver a la presentación</a>
        <button class="link-btn" data-action="reset-demo">Restablecer demo</button>
      </div>
    </aside>
    <div class="overlay" data-action="toggle-sidebar"></div>

    <div class="main">
      <!-- Barra superior -->
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="toggle-sidebar" aria-label="Abrir menú"><i data-icon="menu"></i></button>
        <div class="page-title">
          <h1 id="pageTitle">Panel de control</h1>
          <p id="pageSubtitle"></p>
        </div>

        <form class="topbar-search" id="globalSearch" role="search">
          <i data-icon="search"></i>
          <input type="search" id="globalSearchInput" placeholder="Buscar SKU o producto…" aria-label="Buscar productos">
          <kbd>/</kbd>
        </form>

        <div class="topbar-actions">
          <div class="notif">
            <button class="icon-btn" data-action="toggle-notif" aria-label="Notificaciones" aria-haspopup="true">
              <i data-icon="bell"></i><span class="notif-badge" id="notifBadge" hidden></span>
            </button>
            <div class="notif-panel" id="notifPanel" hidden></div>
          </div>
          <label class="user-select" title="Usuario que registra las operaciones">
            <span class="avatar" id="userAvatar"></span>
            <select id="userSelect" aria-label="Usuario activo"></select>
          </label>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
